name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yns-platform/yns-api
    env:
      ANTHROPIC_API_KEY: test-anthropic-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      FRONTEND_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: test-supabase-service-role-key
      SUPABASE_URL: https://example.supabase.co
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yns-platform/yns-api/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend unit tests
        run: python -m pytest -m "not integration"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yns-platform/yns-web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-supabase-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yns-platform/yns-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit --incremental false

  backend-docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t yns-api-ci yns-platform/yns-api
